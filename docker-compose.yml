name: fanscreator-moderation

x-api-env: &api-env
  DATABASE_URL: postgresql+asyncpg://moderation:moderation@db:5432/moderation
  REDIS_URL: redis://redis:6379/0
  PROVIDER_URL: http://provider:8001
  REAL_PROVIDER_URL: http://real-provider:8002
  MODERATION_PROVIDER: ${MODERATION_PROVIDER:-real}
  MEDIA_STORE: /media-store
  CALLBACK_URL: http://api:8000/provider/callback
  PROVIDER_WEBHOOK_SECRET: ${PROVIDER_WEBHOOK_SECRET:-change-me-in-real-life}
  SCREENING_MODE: ${SCREENING_MODE:-fixed}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  CALLBACK_TIMEOUT_SECONDS: ${CALLBACK_TIMEOUT_SECONDS:-300}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: moderation
      POSTGRES_PASSWORD: moderation
      POSTGRES_DB: moderation
    ports: ["${DB_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moderation -d moderation"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  provider:
    build: ./provider
    environment:
      PROVIDER_WEBHOOK_SECRET: ${PROVIDER_WEBHOOK_SECRET:-change-me-in-real-life}
    ports: ["8001:8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Scores real uploads with a local open-source model (+ OpenAI moderation if
  # OPENAI_API_KEY is set) when MODERATION_PROVIDER=real. First build downloads torch
  # and the model (~1 GB); loading the model takes about a minute.
  real-provider:
    build: ./provider_real
    environment:
      PROVIDER_WEBHOOK_SECRET: ${PROVIDER_WEBHOOK_SECRET:-change-me-in-real-life}
      MEDIA_STORE: /media-store
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes: [media-store:/media-store:ro]
    ports: ["8002:8002"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 90s

  api:
    build: ./api
    environment: *api-env
    volumes: [media-store:/media-store]
    # Migrations and the idempotent seed run before the server starts.
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      provider: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 60

  worker:
    build: ./api
    environment: *api-env
    command: python -m app.screening.worker
    deploy:
      replicas: 2
    depends_on:
      api: { condition: service_healthy }
      # Wait for the model so the first real upload is not held. Not required: with
      # MODERATION_PROVIDER=mock the workers start even if the real provider never comes up.
      real-provider: { condition: service_healthy, required: false }

  web:
    build: ./web
    environment:
      VITE_API_URL: http://localhost:8000
    ports: ["5173:5173"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  media-store:
